name: Merge green content PRs

# Merge-on-green (Session 105; Ian 2026-10-05: no manual merges). Logic and
# fixtures live in qa/merge-green.mjs.
#
# 1. INSTANT PATH (workflow_run): whenever a qa run or a PR-gates run completes,
#    find the open content PR on that branch and squash-merge it as soon as EVERY
#    required check (qa + pr-gates, ruleset 24417620) is success on its CURRENT
#    head sha, no other check is red, the Netlify preview is not red, there is no
#    CHANGES_REQUESTED review and no `no-auto-merge` label. It polls up to ~12 min
#    for checks still running (the PR gates on a bot-pushed head are dispatched
#    at the end of the qa job). The merge pins `sha`, so a commit landing mid-way
#    fails the merge rather than shipping an unchecked head.
# 2. DAILY BACKSTOP (14:00 UTC, or Run workflow): sweeps every open content PR,
#    merges any green one the instant path missed, and Slack-alerts the red or
#    stalled ones (PR #88 sat failing for 20 days with no ping).
#
# Never merges red; never bypasses (github-actions[bot] is not a bypass actor).
# Non-content PRs merge via GitHub native auto-merge (`gh pr merge --auto`).
# A bot merge still deploys (Netlify app) and still fires the Notion Publish
# Status repo webhook; neither depends on who merged.
#
# workflow_run always runs this file from master, so changes here only take
# effect once merged.

on:
  workflow_run:
    # Names are glob patterns here: never put + * ? [ ] ! in a watched workflow's name.
    workflows: ['QA and auto-fix content PRs', 'PR gates']
    types: [completed]
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: merge-green-${{ github.event.workflow_run.head_branch || 'sweep' }}
  cancel-in-progress: false

jobs:
  merge-green:
    # Only branches that can carry a content PR; the sweep covers everything.
    if: github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'content/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout master (merge logic only; no PR code runs here)
        uses: actions/checkout@v6
        with:
          sparse-checkout: qa/merge-green.mjs
          sparse-checkout-cone-mode: false

      - name: Merge green content PRs
        uses: actions/github-script@v8
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const m = await import(`${process.env.GITHUB_WORKSPACE}/qa/merge-green.mjs`);
            if (context.eventName === 'workflow_run') {
              await m.runForBranch({ github, context, core, branch: context.payload.workflow_run.head_branch });
            } else {
              await m.sweep({ github, context, core });
            }
