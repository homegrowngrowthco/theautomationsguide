name: Topic backlog builder

# Surfaces the highest-leverage NET-NEW comparison/alternatives/best-of topics from
# the known tool universe (src/data/tools.ts + AFFILIATE_PIPELINE.md), dedups them
# against everything already published or staged, and stages the survivors in the
# Notion Content Calendar as Status:Suggested.
#
# Status:Suggested NEVER auto-publishes - the publishing engine only fires on
# Status:Queued, which stays a human decision. This job just keeps a fresh, deduped
# idea backlog topped up so the queue never runs dry.
#
# Runs twice weekly (Sunday + Wednesday 06:00 UTC; GitHub starts cron runs 4 to 5 h
# late). Since 2026-10-08 (Session 110) this is the ONLY topic generator: the n8n
# Topic Suggestor is retired (n8n/retire-suggestor.mjs), and every proposal carries a
# deterministic performance score (backlog/signals.mjs) that sets its Priority and
# lands in Notes, so the weekly Queued pick reads a ranked shortlist. Trigger manually
# via the Actions tab; set dry_run=true to preview a batch (artifact + summary)
# WITHOUT writing anything to Notion.
#
# Required repo secrets:
#   ANTHROPIC_API_KEY  - already present (used by the QA pipeline)
#   NOTION_TOKEN       - the Notion internal integration token shared with the engine
#                        (from notion.so/profile/integrations; n8n won't expose it via API)
# Optional:
#   SLACK_WEBHOOK_URL  - NOT yet a repo secret; add it to get a "N topics staged" ping
#   NOTION_DATABASE_ID - repo variable; overrides the default Content Calendar id
#   GSC_TOKEN_JSON     - contents of a Search Console OAuth token.json (client_id/
#                        client_secret/refresh_token, webmasters.readonly scope ONLY).
#                        Enables observed-demand query mining; the builder degrades
#                        gracefully to registry-only topics without it.

on:
  schedule:
    - cron: '0 6 * * 0,3'   # Sundays + Wednesdays 06:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'How many topics to propose'
        required: false
        default: '30'
      dry_run:
        description: 'Preview only - do NOT write to Notion'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read   # read the last runs' backlog-batch artifacts (recent dropped titles)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fence regression test, BEFORE anything can write to Notion. Replays the
      # 36 topics scrubbed by hand on 2026-08-12 through the live dedup/fence
      # logic and fails if any would now be staged again, or if the control set
      # gets over-blocked. Key-free and offline, so it costs nothing and cannot
      # flake on an API.
      - name: Guard selftest (2026-08-12 scrub fixture)
        run: node backlog/build-backlog.mjs --selftest

      - name: Resolve run config
        id: cfg
        run: |
          # 30 per run, twice a week (op #1498). Asked for 15, the builder kept 20 of 105 from
          # 10/18 to 11/04, about 1.2 topics a day against 2 a day published.
          COUNT="${{ github.event.inputs.count || '30' }}"
          # Scheduled runs always stage. Manual runs stage unless dry_run=true.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            STAGE=""
            PRUNE=""
            echo "Manual dry run - will NOT write to Notion."
          else
            STAGE="--stage"
            PRUNE="--prune-apply"
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "prune=$PRUNE" >> "$GITHUB_OUTPUT"

      # The last 3 successful master runs' dropped titles become "do not re-propose" in the
      # prompt. The store is the backlog-batch artifact every run already uploads (90 days),
      # so CI commits nothing. Successful runs only: a run that died before the build uploads
      # the stale backlog-batch.json committed in the repo. Feedback is an optimisation, so a
      # failure here warns and the build proposes without it.
      - name: Fetch recent dropped titles
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          got=0
          for id in $(gh run list --workflow topic-backlog.yml --branch master --status success --limit 6 --json databaseId --jq '.[].databaseId'); do
            [ "$got" -ge 3 ] && break
            if gh run download "$id" -n backlog-batch -D "$RUNNER_TEMP/recent-drops/$id"; then
              got=$((got + 1))
            else
              echo "::warning::no backlog-batch artifact read from run $id"
            fi
          done
          echo "Recent batches fetched: $got"
          exit 0

      - name: Build (and stage) the backlog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: node backlog/build-backlog.mjs --count=${{ steps.cfg.outputs.count }} --recent-drops="$RUNNER_TEMP/recent-drops" ${{ steps.cfg.outputs.stage }}

      - name: Queue self-clean (audit Queued/Suggested vs published corpus)
        # Runs AFTER staging so freshly staged rows are audited too. Dry-run manual
        # runs audit without writing (no --prune-apply). Only hard dedup collisions
        # are auto-Skipped; fence advisories are report-only (see build-backlog.mjs).
        # GSC feeds the hub-fence advisory (near-win /tools/ hubs); without it the
        # audit skips that advisory and says so.
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          node backlog/build-backlog.mjs --audit-queue ${{ steps.cfg.outputs.prune }} 2>&1 | tee queue-audit.txt
          {
            echo ''
            echo '### Queue self-clean'
            echo '~~~'
            cat queue-audit.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish batch to the run summary
        if: always()
        run: |
          if [ -f backlog/backlog-batch.md ]; then
            cat backlog/backlog-batch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No batch produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backlog-batch
          path: |
            backlog/backlog-batch.md
            backlog/backlog-batch.json
          if-no-files-found: ignore

      - name: Slack - topics staged
        if: steps.cfg.outputs.stage == '--stage' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COUNT=$(node -e "const b=require('./backlog/backlog-batch.json');process.stdout.write(String(b.topics.length))" 2>/dev/null || echo "?")
          curl -sS -X POST -H 'content-type: application/json' "$SLACK_WEBHOOK_URL" \
            -d "{\"text\":\":bulb: *Topic backlog refreshed* - $COUNT new topics staged in the Notion Content Calendar as Suggested. Review and flip the best ones to Queued to publish.\"}"
