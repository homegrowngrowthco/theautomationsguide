name: QA + auto-fix content PRs

# QA pipeline for engine-generated content PRs.
#
# Flow:
#   1. PR opened or pushed on a `content/` branch (or any push to that branch).
#   2. Deterministic gates (no API key, no browser, fail fast + cheap):
#      - qa/lint-content.mjs --post : syntax/structure + registry integrity.
#      - npm run build : the real MDX compiler.
#      - qa/render-acceptance.mjs --post : the BUILT page actually rendered
#        (post present, DecisionTree branches all rendered, tool logos present).
#   3. Mobile-overflow gate (headless Chromium, 390px) — deterministic, local.
#   4. Serve the built dist locally (astro preview) + capture Playwright
#      screenshots of the new post at 4 breakpoints. NO Netlify dependency — the
#      Netlify wait used to run here and a timeout skipped visual QA entirely.
#   5. Send to Claude Vision (qa/qa-pr-review.mjs), get JSON verdict.
#   6. If shouldFix=true AND < 2 prior fixes: ask Claude to rewrite the .mdx
#      (qa/qa-pr-fix.mjs, scoped to MDX spacing/ordering). The fix must BUILD and
#      pass render-acceptance before it is pushed — a bad fix fails the job
#      instead of landing. Commit + push with `[qa-fix-N]` → re-run.
#   7. If shouldFix=true AND 2 prior fixes: PR comment + Slack, manual review.
#   8. If shouldFix=false: green QA-pass comment.
#   9. On ANY step failure (a gate, build, local preview/screenshots, fixer
#      crash): the failure() steps at the end post a manual-review comment +
#      Slack so a defect never dies silently (the PR #65 gap).
#
# Retry tracking: we count commits in this PR matching `[qa-fix-N]`. Hard cap at 2
# fix attempts to prevent infinite loops + cost runaway. Each loop costs roughly
# $0.05-$0.10 in Anthropic API calls.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  qa:
    if: startsWith(github.event.pull_request.head.ref, 'content/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15

    steps:
      - name: Skip our own commits
        id: skip-check
        run: |
          if [[ "${{ github.event.pull_request.user.login }}" == "github-actions[bot]" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
          # Also skip if the latest commit is ours (loop guard).
          LATEST_MSG=$(git log -1 --pretty=%s ${{ github.event.pull_request.head.sha }} 2>/dev/null || echo "")
          if echo "$LATEST_MSG" | grep -qE '^\[qa-fix-[0-9]+\]'; then
            # Latest commit is a qa-fix commit — let it process so we can re-review.
            echo "Latest commit is a qa-fix; proceeding to re-review."
          fi

      - name: Checkout PR branch
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Count prior qa-fix attempts on this branch
        if: steps.skip-check.outputs.skip != 'true'
        id: retry-count
        run: |
          # grep -c outputs "0" AND exits 1 when there are zero matches, which
          # would trigger `|| echo "0"` and write "0\n0" to GITHUB_OUTPUT
          # (breaking it). Pipe through `wc -l` instead — works regardless of
          # match count and always exits 0.
          COUNT=$(git log --pretty=%s origin/master..HEAD | grep -E '^\[qa-fix-[0-9]+\]' | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Prior fix attempts: $COUNT"

      - name: Identify changed post slug
        if: steps.skip-check.outputs.skip != 'true'
        id: slug
        run: |
          # The engine commits a single .mdx in src/content/blog/.
          POST=$(git diff --name-only origin/master..HEAD -- 'src/content/blog/*.mdx' | head -1)
          if [ -z "$POST" ]; then
            echo "No .mdx post changed in this PR; skipping QA."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            SLUG=$(basename "$POST" .mdx)
            # Match the slug format used by qa-screenshots.mjs (slugify of /blog/<slug>).
            SCREENSHOT_SLUG="blog_${SLUG}"
            echo "post=$POST" >> $GITHUB_OUTPUT
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
            echo "screenshot_slug=$SCREENSHOT_SLUG" >> $GITHUB_OUTPUT
            echo "Post: $POST  Slug: $SLUG"
          fi

      - name: Lint content (deterministic gate)
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        env:
          POST: ${{ steps.slug.outputs.post }}
        run: |
          # Deterministic backstop for the formatting defects that used to reach
          # the live preview: camelCase SVG attrs (Astro drops them), em/en dashes,
          # multi-column inline grid/flex wrappers (the squish bug), broken
          # /go/<slug> + /tools/<slug> links, and hallucinated/un-imported
          # components. The n8n engine sanitizeMdx() prevents most of these at
          # generation, but hand edits and direct commits bypass it — this is the
          # hard gate. Exits 1 on any HARD violation, failing the PR check.
          node qa/lint-content.mjs --post "$POST"

      - name: Setup Node
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        run: npm ci

      # Deterministic LOGO-ASSET gate. The post-scoped gates check post structure
      # and horizontal overflow, never the brand images themselves — so a logo
      # shipped with a baked-in solid background (beehiiv.png was pure white, so it
      # sat in a white box on the cream homepage strip) passed everything green.
      # This samples each raster logo's corners and hard-fails on an opaque
      # background. Cheap, no build needed; runs right after deps.
      - name: Logo-asset gate (deterministic)
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        run: npm run qa:logos

      # Compile the site in-CI BEFORE the Netlify wait. This is the real MDX
      # compiler, so it catches the whole class the regex linter can't: bare
      # {{merge_tags}} parsed as JSX expressions (ReferenceError), unclosed SVG
      # attribute quotes, hallucinated/broken JSX. Fails in ~30s with the actual
      # error instead of an opaque "Netlify deploy preview failed" timeout,
      # and runs before the Playwright install so failures are cheap.
      - name: Build site (catch MDX compile errors fast)
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        run: npm run build

      # Deterministic RENDERED-result gate (the layer the regex linter + compiler
      # can't cover). Parses the BUILT dist/blog/<slug>/index.html and hard-fails
      # if the post didn't render, a DecisionTree branch was dropped/cramped, or a
      # registry-backed tool logo didn't show up — the exact PR #65 defect class.
      # Runs before the expensive Playwright install / Vision review so a bad
      # render fails fast and cheap, with a named error.
      - name: Render-acceptance gate (deterministic, post-build)
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        env:
          POST: ${{ steps.slug.outputs.post }}
        run: node qa/render-acceptance.mjs --post "$POST"

      - name: Install Playwright Chromium
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      # Deterministic MOBILE-OVERFLOW gate. render-acceptance uses linkedom (no
      # layout), so it can't see "this component is clipped off the right edge at
      # 390px" — the class that reached Ian on PR #74's flowchart. This renders the
      # BUILT post in headless Chromium at 390px and hard-fails on SEVERE overflow
      # (an element >96px past the viewport edge; minor table/price overflow is
      # exempt, as are pre/code and overflow-x:auto elements). Runs against the
      # local dist with NO Netlify and NO API dependency, BEFORE the Netlify wait,
      # so this class is caught even when the Netlify step times out (which skips
      # the Vision bot). Validated to fail #74's pre-fix render and pass all 35
      # existing posts.
      - name: Mobile-overflow gate (deterministic, post-build)
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        run: node qa/mobile-overflow.mjs --slug "${{ steps.slug.outputs.slug }}"

      # Serve the already-built dist/ locally instead of waiting on the Netlify
      # deploy preview. The Netlify wait was the engine's biggest QA flake: it ran
      # BEFORE the Vision review, so a timeout SKIPPED visual QA entirely — the gap
      # that let PR #74's flowchart reach the live preview. The local build is the
      # exact PR-head build (`npm run build` ran above), renders identically for
      # layout QA, and has no external dependency. Netlify still builds its own
      # preview independently for human review on the PR.
      - name: Serve built dist (astro preview)
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        run: |
          npx astro preview --port 4321 &
          # Wait until the preview server answers (max ~30s) before screenshotting.
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null "http://localhost:4321/"; then
              echo "astro preview is up."; exit 0
            fi
            sleep 1
          done
          echo "astro preview did not come up within 30s."; exit 1

      - name: Capture screenshots
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        env:
          QA_BASE_URL: http://localhost:4321
        # Scope to the one changed post (~4 shots) instead of all ~35 posts
        # (171 shots). The Vision review below already reads only this slug.
        run: node qa/qa-screenshots.mjs --slug "${{ steps.slug.outputs.slug }}"

      - name: Run Claude Vision review
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node qa/qa-pr-review.mjs --slug "${{ steps.slug.outputs.slug }}" > qa-review.json
          cat qa-review.json
          SHOULD_FIX=$(jq -r '.shouldFix' qa-review.json)
          CONFIDENCE=$(jq -r '.confidence' qa-review.json)
          SUMMARY=$(jq -r '.summary' qa-review.json)
          echo "should_fix=$SHOULD_FIX" >> $GITHUB_OUTPUT
          echo "confidence=$CONFIDENCE" >> $GITHUB_OUTPUT
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Decide branch — fix, manual, or pass
        if: steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        id: decide
        run: |
          SHOULD_FIX="${{ steps.review.outputs.should_fix }}"
          PRIOR_FIXES="${{ steps.retry-count.outputs.count }}"
          if [ "$SHOULD_FIX" != "true" ]; then
            echo "branch=pass" >> $GITHUB_OUTPUT
          elif [ "$PRIOR_FIXES" -ge 2 ]; then
            echo "branch=manual" >> $GITHUB_OUTPUT
          else
            NEXT=$((PRIOR_FIXES + 1))
            echo "branch=fix" >> $GITHUB_OUTPUT
            echo "next_attempt=$NEXT" >> $GITHUB_OUTPUT
          fi

      - name: Apply Claude fix
        if: steps.decide.outputs.branch == 'fix'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node qa/qa-pr-fix.mjs \
            --post "${{ steps.slug.outputs.post }}" \
            --review qa-review.json

      # A bad auto-fix must NEVER be pushed. Build AND render-acceptance must both
      # pass before the commit step runs — if the fixer's edit broke compilation
      # or rendering, the job fails here (before push), the working-tree change is
      # discarded, and the failure path below pings for manual review.
      - name: Verify the fix builds and renders
        if: steps.decide.outputs.branch == 'fix'
        run: |
          npm run build
          node qa/render-acceptance.mjs --post "${{ steps.slug.outputs.post }}"
          node qa/mobile-overflow.mjs --slug "${{ steps.slug.outputs.slug }}"

      - name: Commit and push the fix
        if: steps.decide.outputs.branch == 'fix'
        env:
          ATTEMPT: ${{ steps.decide.outputs.next_attempt }}
          POST: ${{ steps.slug.outputs.post }}
          SUMMARY: ${{ steps.review.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$POST"
          if git diff --staged --quiet; then
            echo "No changes after fix attempt — skipping commit."
            exit 0
          fi
          git commit -m "[qa-fix-$ATTEMPT] Auto-fix layout issues from Claude Vision review

          Issues addressed: $SUMMARY

          Generated by .github/workflows/qa-content-pr.yml. Re-running QA
          on this commit will verify whether the fix landed."
          git push origin "${{ github.event.pull_request.head.ref }}"

      - name: Comment on PR — fix applied
        if: steps.decide.outputs.branch == 'fix'
        uses: actions/github-script@v8
        env:
          ATTEMPT: ${{ steps.decide.outputs.next_attempt }}
          SUMMARY: ${{ steps.review.outputs.summary }}
          ISSUES_JSON: ${{ steps.review.outputs.should_fix }}
        with:
          script: |
            const review = require('./qa-review.json');
            const lines = [
              `🤖 **QA fix attempt ${process.env.ATTEMPT} of 2** applied automatically.`,
              ``,
              `**Issues found:** ${review.issues.length}`,
              ...review.issues.map(i => `- \`${i.severity}\` (${i.viewport}): ${i.description} → _${i.suggestedFix}_`),
              ``,
              `Re-running QA on the new commit. If the fix doesn't fully resolve, I'll try once more (max 2 attempts) before flagging for manual review.`,
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: lines.join('\n'),
            });

      - name: Comment on PR — manual review needed
        if: steps.decide.outputs.branch == 'manual'
        uses: actions/github-script@v8
        with:
          script: |
            const review = require('./qa-review.json');
            const lines = [
              `🚨 **QA fix limit reached** — 2 auto-fix attempts didn't resolve all issues.`,
              ``,
              `**Remaining issues:**`,
              ...review.issues.map(i => `- \`${i.severity}\` (${i.viewport}): ${i.description}`),
              ``,
              `Manual review needed. Either fix the post directly on the PR branch, dismiss as a false positive, or close the PR.`,
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: lines.join('\n'),
            });

      - name: Slack — manual review needed
        if: steps.decide.outputs.branch == 'manual' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SUMMARY: ${{ steps.review.outputs.summary }}
        run: |
          curl -sS -X POST -H 'content-type: application/json' "$SLACK_WEBHOOK_URL" \
            -d "{\"text\":\"🚨 *QA pipeline hit retry limit on a content PR*\nPR: $PR_URL\nIssues: $SUMMARY\nManual review needed.\"}"

      - name: Comment on PR — QA pass
        if: steps.decide.outputs.branch == 'pass'
        uses: actions/github-script@v8
        with:
          script: |
            const review = require('./qa-review.json');
            const attemptInfo = '${{ steps.retry-count.outputs.count }}' === '0'
              ? 'on first review.'
              : `after ${{ steps.retry-count.outputs.count }} auto-fix attempt(s).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `✅ **QA pass** ${attemptInfo}\n\n_${review.summary}_\n\nReady for human review on the deploy preview.`,
            });

      # STOP SILENT FAILURES. If ANY prior step failed — the deterministic lint or
      # render-acceptance gate, the build, the Netlify wait/timeout, or the Vision
      # fixer crashing — the job ends red with nothing posted to the PR and no
      # ping (the exact gap on PR #65). These two steps run on failure() so a real
      # defect or infra problem always reaches Ian for manual review.
      - name: Comment on PR — QA failed (manual review)
        if: failure() && steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                `🚨 **QA failed — manual review needed.**`,
                ``,
                `A QA step failed (deterministic lint / render-acceptance / mobile-overflow gate, build, local preview/screenshots, or the auto-fixer). This PR did **not** pass QA and was not auto-fixed.`,
                ``,
                `See the failed run for the specific step + error: ${runUrl}`,
                ``,
                `Fix the post on the branch, or close the PR.`,
              ].join('\n'),
            });

      - name: Slack — QA failed (manual review)
        if: failure() && steps.slug.outputs.skip != 'true' && steps.skip-check.outputs.skip != 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST -H 'content-type: application/json' "$SLACK_WEBHOOK_URL" \
            -d "{\"text\":\"🚨 *QA failed on a content PR (manual review needed)*\nPR: $PR_URL\nFailed run: $RUN_URL\"}"
