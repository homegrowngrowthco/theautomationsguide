[[redirects]]
  from = "/blog/revops-automation-stack-2026/"
  to = "/blog/2026-05-03-revops-automation-stack-wed-build-with-500mo-in-2026/"
  status = 301

[[redirects]]
  from = "/blog/revops-tech-stack-2025/"
  to = "/blog/2026-05-03-revops-automation-stack-wed-build-with-500mo-in-2026/"
